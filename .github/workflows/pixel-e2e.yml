# Сквозная проверка пикселя Meta и Метрики на живом сайте: настоящий Chrome с окном (xvfb), события уходят реально.
# Запуск вручную: Actions → pixel-e2e → Run workflow.
name: pixel-e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/pixel_e2e.py
          sparse-checkout-cone-mode: false
      # Python фиксирован: на новейшем Python раннера greenlet (зависимость playwright) собирается из исходников и падает.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Браузер не качаем: скрипт берёт Google Chrome, который уже стоит на ubuntu-latest.
      - run: pip install --quiet playwright
      - name: Проверка
        run: xvfb-run -a python3 scripts/pixel_e2e.py
